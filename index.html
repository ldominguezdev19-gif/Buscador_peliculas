<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="titulo">
        <h1>CINEBUSCADOR</h1>
        <p>Encuentra cualquier pelicula por su nombre</p>
    </header>
    <main>
        <section class="buscador">
            <form>
                <input id="nombre-peli" type="text" placeholder="Escribe el nombre de una pelicula..." aria-label="Buscar pelicula" autocomplete="off">
                <button type="submit" class="btn-buscar">Buscar</button>
            </form>
        </section>
        <section id="lista-peliculas" class="peliculas"></section>
    </main>
</body>
</html>
